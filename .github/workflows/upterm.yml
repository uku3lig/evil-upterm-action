name: Start upterm session

on:
  workflow_dispatch:
    inputs:
      image:
        description: "GHA image"
        required: true
        type: choice
        options:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-latest"
          - "windows-latest"
      reclaim_space:
        description: "Free up space"
        required: true
        type: boolean
        default: true
      terminfos:
        description: "Additional terminfos"
        required: false
        type: string
        default: "ghostty,alacritty"
      tailscale:
        description: "Add the device to a tailnet"
        required: true
        type: boolean
        default: false

jobs:
  upterm:
    runs-on: ${{ inputs.image }}

    steps:
      - uses: actions/checkout@v6

      - name: Reclaim space (Linux)
        if: runner.os == 'Linux' && inputs.reclaim_space
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "carve"

      - name: Install Nix
        if: runner.os != 'Windows'
        uses: cachix/install-nix-action@v31

      - name: Install terminfos
        if: inputs.terminfos != '' && runner.os == 'Linux'
        run: |
          out_path=$(nix build --no-link --print-out-paths -f terminfo.nix --argstr terminfos ${{ inputs.terminfos }})
          rm -rf /usr/share/terminfo
          cp -r "$out_path/share/terminfo" /usr/share/terminfo

      - name: Add to tailnet
        if: inputs.tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
